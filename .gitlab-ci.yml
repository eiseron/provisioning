    file: /templates/terraform-validate.yml
    ref: v0.1.8
    inputs:
      name: "-prod-platform"
      chdir: modules/prod_platform/examples/validate
  - project: eiseron/stack/ci
    file: /templates/terraform-validate.yml
    ref: v0.1.8
    inputs:
      name: "-observability"
      chdir: modules/observability
  - project: eiseron/stack/ci
    file: /templates/terraform-validate.yml
    ref: v0.1.8
    inputs:
      name: "-swarm-stack"
      chdir: modules/swarm_stack/examples/validate
  - project: eiseron/stack/ci
    file: /templates/terraform-validate.yml
    ref: v0.1.8
    inputs:
      name: "-swarm-postgres"
      chdir: modules/swarm_postgres/examples/validate
  - project: eiseron/stack/ci
    file: /templates/terraform-validate.yml
    ref: v0.1.8
    inputs:
      name: "-swarm-app"
      chdir: modules/swarm_app/examples/validate
  - project: eiseron/stack/ci
    file: /templates/terraform-validate.yml
    ref: v0.1.8
    inputs:
      name: "-swarm-observability"
      chdir: modules/swarm_observability/examples/validate
  - project: eiseron/stack/ci
    file: /templates/terraform-validate.yml
    ref: v0.1.8
    inputs:
      name: "-tang-host"
      chdir: modules/tang_host
  - project: eiseron/stack/ci
    file: /templates/terraform-validate.yml
    ref: v0.1.8
    inputs:
      name: "-sops-drift-schedule"
      chdir: modules/sops_drift_schedule
  - project: eiseron/stack/ci
    file: /templates/terraform-validate.yml
    ref: v0.1.8
    inputs:
      name: "-db-backup-r2"
      chdir: modules/db_backup_r2
  - project: eiseron/stack/ci
    file: /templates/terraform-validate.yml
    ref: v0.1.8
    inputs:
      name: "-pages-preview"
      chdir: modules/pages_preview
  - project: eiseron/stack/ci
    file: /templates/terraform-validate.yml
    ref: v0.1.8
    inputs:
      name: "-gitlab-repository-protected"
      chdir: modules/gitlab_repository_protected
  - project: eiseron/stack/ci
    file: /templates/terraform-validate.yml
    ref: v0.1.8
    inputs:
      name: "-organization"
      chdir: modules/organization
  - project: eiseron/stack/ci
    file: /templates/ansible-collection.yml
    ref: v0.1.3
    inputs:
      playbook: playbooks/preview_host.yml
  - project: eiseron/stack/ci
    file: /templates/ansible-collection.yml
    ref: v0.1.18
    inputs:
      name: "-prod-host"
      playbook: playbooks/prod-host.yml
  - project: eiseron/stack/ci
    file: /templates/release.yml
    ref: v0.1.3
  - project: eiseron/stack/ci
    file: /templates/sync-github.yml
    ref: v0.1.3

stages:
  - validate
  - release
  - sync

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

kamal-render:
  stage: validate
  image: ruby:3.3-alpine
  tags:
    - self-hosted
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - ruby test/kamal/render_app_deploy_test.rb
    - ruby test/kamal/render_observability_deploy_test.rb
    - ruby test/kamal/observability_collector_redaction_test.rb
    - ruby test/tofu/observability_password_policy_test.rb
    - ruby test/tofu/release_branch_protection_test.rb
    - ruby test/tofu/cloudflare_pages_phase4_test.rb
    - ruby test/tofu/github_repos_phase5_test.rb
    - ruby test/tofu/admin_gate_test.rb
    - ruby test/tofu/product_db_backup_test.rb
    - ruby test/tofu/otp_identity_provider_test.rb
    - ruby test/tofu/media_test.rb
