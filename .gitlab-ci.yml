include:
  - project: eiseron/stack/ci
    file: /templates/terraform-validate.yml
    ref: v0.1.8
    inputs:
      name: "-preview-host"
      chdir: modules/preview_host
  - project: eiseron/stack/ci
    file: /templates/terraform-validate.yml
    ref: v0.1.8
    inputs:
      name: "-preview-cloudflare"
      chdir: modules/preview_cloudflare
  - project: eiseron/stack/ci
    file: /templates/terraform-validate.yml
    ref: v0.1.8
    inputs:
      name: "-product"
      chdir: modules/product
  - project: eiseron/stack/ci
    file: /templates/terraform-validate.yml
    ref: v0.1.8
    inputs:
      name: "-prod-host"
      chdir: modules/prod_host
  - project: eiseron/stack/ci
    file: /templates/ansible-collection.yml
    ref: v0.1.3
    inputs:
      playbook: playbooks/preview_host.yml
  - project: eiseron/stack/ci
    file: /templates/ansible-collection.yml
    ref: v0.1.18
    inputs:
      name: "-prod-host"
      playbook: playbooks/prod-host.yml
  - project: eiseron/stack/ci
    file: /templates/release.yml
    ref: v0.1.3
  - project: eiseron/stack/ci
    file: /templates/sync-github.yml
    ref: v0.1.3

stages:
  - validate
  - release
  - sync

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
