include:
  - project: eiseron/stack/ci
    file: /templates/terraform-validate.yml
    ref: v0.9.47
    inputs:
      chdirs:
        - modules/preview_host
        - modules/preview_cloudflare
        - modules/product
        - modules/product_instance
        - modules/prod_host
        - modules/coreos_host/examples/validate
        - modules/prod_platform/examples/validate
        - modules/observability
        - modules/swarm_stack/examples/validate
        - modules/swarm_postgres/examples/validate
        - modules/swarm_app/examples/validate
        - modules/swarm_observability/examples/validate
        - modules/k3s_platform/examples/validate
        - modules/tang_host
        - modules/sops_drift_schedule
        - modules/db_backup_r2
        - modules/pages_preview
        - modules/gitlab_repository_protected
        - modules/organization
        - modules/github_repository
        - modules/github_repository_protected
        - modules/gitlab_repository
        - modules/gitlab_runner
  - project: eiseron/stack/ci
    file: /templates/tofu-test.yml
    ref: v0.9.47
    inputs:
      chdirs:
        - modules/preview_host
        - modules/preview_cloudflare
        - modules/product_instance
        - modules/prod_host
        - modules/coreos_host/examples/validate
        - modules/prod_platform/examples/validate
        - modules/observability
        - modules/swarm_stack/examples/validate
        - modules/swarm_postgres/examples/validate
        - modules/swarm_app/examples/validate
        - modules/swarm_observability/examples/validate
        - modules/k3s_platform/examples/validate
        - modules/tang_host
        - modules/sops_drift_schedule
        - modules/db_backup_r2
        - modules/pages_preview
        - modules/gitlab_repository_protected
        - modules/organization
        - modules/github_repository
        - modules/github_repository_protected
        - modules/gitlab_repository
        - modules/gitlab_runner
  - project: eiseron/stack/ci
    file: /templates/ansible-collection.yml
    ref: v0.1.3
    inputs:
      playbook: playbooks/preview_host.yml
  - project: eiseron/stack/ci
    file: /templates/ansible-collection.yml
    ref: v0.1.18
    inputs:
      name: "-prod-host"
      playbook: playbooks/prod-host.yml
  - project: eiseron/stack/ci
    file: /templates/release.yml
    ref: v0.1.3
  - project: eiseron/stack/ci
    file: /templates/sync-github.yml
    ref: v0.1.3

stages:
  - validate
  - test
  - release
  - sync

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

kamal-render:
  stage: validate
  image: ruby:3.3-alpine
  tags:
    - self-hosted
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - ruby test/kamal/render_app_deploy_test.rb
    - ruby test/kamal/render_observability_deploy_test.rb
    - ruby test/kamal/observability_collector_redaction_test.rb
    - ruby test/tofu/observability_password_policy_test.rb
    - ruby test/tofu/release_branch_protection_test.rb
    - ruby test/tofu/cloudflare_pages_phase4_test.rb
    - ruby test/tofu/github_repos_phase5_test.rb
    - ruby test/tofu/admin_gate_test.rb
    - ruby test/tofu/product_db_backup_test.rb
    - ruby test/tofu/otp_identity_provider_test.rb
    - ruby test/tofu/media_test.rb
