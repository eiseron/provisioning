    file: /templates/terraform-validate.yml
    ref: v0.1.8
    inputs:
      name: "-preview-cloudflare"
      chdir: modules/preview_cloudflare
  - project: eiseron/stack/ci
    file: /templates/terraform-validate.yml
    ref: v0.1.8
