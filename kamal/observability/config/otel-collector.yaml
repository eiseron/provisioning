receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  prometheus:
    config:
      scrape_configs:
        - job_name: node
          scrape_interval: 30s
          static_configs:
            - targets: ["${env:OBSERVABILITY_NODE_TARGET}"]
        - job_name: cadvisor
          scrape_interval: 30s
          static_configs:
            - targets: ["${env:OBSERVABILITY_CADVISOR_TARGET}"]
        - job_name: postgres
          scrape_interval: 30s
          static_configs:
            - targets: ["${env:OBSERVABILITY_POSTGRES_TARGET}"]

processors:
  batch: {}

exporters:
  otlphttp/openobserve:
    endpoint: ${env:OBSERVABILITY_OTLP_ENDPOINT}
    headers:
      Authorization: ${env:OBSERVABILITY_OTLP_AUTH}
      organization: ${env:OBSERVABILITY_OTLP_ORG}

service:
  telemetry:
    metrics:
      level: none
  pipelines:
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/openobserve]
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/openobserve]
    metrics:
      receivers: [otlp, prometheus]
      processors: [batch]
      exporters: [otlphttp/openobserve]
