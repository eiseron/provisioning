service: platform
image: <%= ENV.fetch("PLATFORM_NOOP_IMAGE", "#{ENV["KAMAL_REGISTRY_SERVER"]}/platform/noop") %>

servers:
  web:
    hosts:
      - <%= ENV.fetch("PROD_HOST") %>

registry:
  server: <%= ENV.fetch("KAMAL_REGISTRY_SERVER", "registry.gitlab.com") %>
  username:
    - KAMAL_REGISTRY_USERNAME
  password:
    - KAMAL_REGISTRY_PASSWORD

ssh:
  user: <%= ENV.fetch("DEPLOY_SSH_USER", "deploy") %>

builder:
  arch: amd64

accessories:
  db:
    image: postgres:18
    host: <%= ENV.fetch("PROD_HOST") %>
    network: kamal
    env:
      clear:
        POSTGRES_DB: postgres
        POSTGRES_USER: <%= ENV.fetch("PG_ADMIN_USER", "eiseron") %>
        PGDATA: /var/lib/postgresql/data/pgdata
      secret:
        - POSTGRES_PASSWORD
    directories:
      - /var/lib/crypt/postgres:/var/lib/postgresql/data
<% unless ENV.fetch("PROD_BACKUP_BUCKET", "").empty? %>
  backup:
    image: <%= ENV.fetch("BACKUP_IMAGE", "registry.gitlab.com/eiseron/stack/automation:v0.25.0") %>
    host: <%= ENV.fetch("PROD_HOST") %>
    network: kamal
    cmd: eiseron db backup schedule
    env:
      clear:
        BACKUP_CRON: "<%= ENV.fetch("BACKUP_CRON", "0 5 * * *") %>"
        PROD_BACKUP_NAME: "<%= ENV.fetch("PROD_BACKUP_NAME") %>"
        PROD_BACKUP_BUCKET: "<%= ENV.fetch("PROD_BACKUP_BUCKET") %>"
        PROD_BACKUP_AGE_RECIPIENTS: "<%= ENV.fetch("PROD_BACKUP_AGE_RECIPIENTS") %>"
        CLOUDFLARE_ACCOUNT_ID: "<%= ENV.fetch("CLOUDFLARE_ACCOUNT_ID") %>"
        PROD_BACKUP_RETENTION_DAYS: "<%= ENV.fetch("PROD_BACKUP_RETENTION_DAYS", "15") %>"
        PROD_BACKUP_DIR: /backups
        PGHOST: platform-db
        PGUSER: <%= ENV.fetch("PG_ADMIN_USER", "eiseron") %>
        PROD_BACKUP_DATABASE: "<%= ENV.fetch("PROD_BACKUP_NAME") %>_prod"
      secret:
        - AWS_ACCESS_KEY_ID
        - AWS_SECRET_ACCESS_KEY
        - PGPASSWORD
    directories:
      - /var/lib/crypt/backups:/backups
<% end %>
