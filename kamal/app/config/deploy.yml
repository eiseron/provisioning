service: <%= ENV.fetch("APP_SERVICE") %>
image: <%= ENV.fetch("APP_IMAGE") %>

servers:
  web:
    hosts:
      - <%= ENV.fetch("PROD_HOST") %>

proxy:
  ssl: <%= ENV.fetch("PROXY_SSL", "true") %>
<% if ENV["ADMIN_ACCESS_HOST"].to_s != "" %>
  hosts:
    - <%= ENV.fetch("APP_HOST") %>
    - <%= ENV.fetch("ADMIN_ACCESS_HOST") %>
<% else %>
  host: <%= ENV.fetch("APP_HOST") %>
<% end %>
  app_port: <%= ENV.fetch("APP_PORT", "4000") %>

registry:
  server: <%= ENV.fetch("KAMAL_REGISTRY_SERVER", "registry.gitlab.com") %>
  username:
    - KAMAL_REGISTRY_USERNAME
  password:
    - KAMAL_REGISTRY_PASSWORD

ssh:
  user: <%= ENV.fetch("DEPLOY_SSH_USER", "deploy") %>

builder:
  arch: amd64

env:
  clear:
    PHX_HOST: <%= ENV.fetch("APP_HOST") %>
    PORT: <%= ENV.fetch("APP_PORT", "4000") %>
    PHX_SERVER: "true"
    POOL_SIZE: "10"
<% if ENV["OBSERVABILITY_OTLP_ENDPOINT"].to_s != "" %>
    OBSERVABILITY_OTLP_ENDPOINT: <%= ENV.fetch("OBSERVABILITY_OTLP_ENDPOINT") %>
<% end %>
<% if ENV["ADMIN_ACCESS_AUDIENCES"].to_s != "" %>
    ADMIN_ACCESS_ISSUER: <%= ENV.fetch("ADMIN_ACCESS_ISSUER") %>
    ADMIN_ACCESS_CERTS_URL: <%= ENV.fetch("ADMIN_ACCESS_CERTS_URL") %>
<% end %>
<% if ENV["MEDIA_R2_BUCKET"].to_s != "" %>
    MEDIA_PUBLIC_BASE_URL: <%= ENV.fetch("MEDIA_PUBLIC_BASE_URL") %>
<% end %>
  secret:
    - SECRET_KEY_BASE
    - DATABASE_URL
<% if ENV["ADMIN_ACCESS_AUDIENCES"].to_s != "" %>
    - ADMIN_ACCESS_AUDIENCES
<% end %>
<% if ENV["MEDIA_R2_BUCKET"].to_s != "" %>
    - MEDIA_R2_BUCKET
    - MEDIA_R2_ENDPOINT
    - MEDIA_R2_ACCESS_KEY_ID
    - MEDIA_R2_SECRET_ACCESS_KEY
<% end %>
<% if ENV["PROD_BACKUP_BUCKET"].to_s != "" %>
accessories:
  backup:
    image: <%= ENV.fetch("BACKUP_IMAGE", "registry.gitlab.com/eiseron/stack/automation:v0.39.0") %>
    host: <%= ENV.fetch("PROD_HOST") %>
    network: kamal
    cmd: eiseron db backup schedule
    env:
      clear:
        PGHOST: <%= ENV.fetch("PG_CONTAINER", "platform-db") %>
        PGUSER: <%= ENV.fetch("PROD_TENANT_SLUG") %>
        PROD_BACKUP_NAME: <%= ENV.fetch("PROD_TENANT_SLUG") %>
        PROD_BACKUP_DATABASE: <%= ENV.fetch("PROD_TENANT_SLUG") %>_prod
        PROD_BACKUP_BUCKET: <%= ENV.fetch("PROD_BACKUP_BUCKET") %>
        PROD_BACKUP_DIR: /backups
        CLOUDFLARE_ACCOUNT_ID: <%= ENV.fetch("CLOUDFLARE_ACCOUNT_ID") %>
        PROD_BACKUP_AGE_RECIPIENTS: <%= ENV.fetch("PROD_BACKUP_AGE_RECIPIENTS") %>
        BACKUP_CRON: <%= ENV.fetch("BACKUP_CRON", "0 4 * * *") %>
      secret:
        - PGPASSWORD
        - AWS_ACCESS_KEY_ID
        - AWS_SECRET_ACCESS_KEY
        - TELEGRAM_BOT_TOKEN
        - TELEGRAM_CHAT_ID
    directories:
      - <%= ENV.fetch("PROD_BACKUP_STAGING", "/var/lib/crypt/#{ENV.fetch("PROD_TENANT_SLUG")}/backups") %>:/backups
    options:
      restart: unless-stopped
      health-cmd: "eiseron db backup healthcheck"
      health-interval: 30s
<% end %>
