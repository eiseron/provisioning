service: <%= ENV.fetch("APP_SERVICE") %>
image: <%= ENV.fetch("APP_IMAGE") %>

servers:
  web:
    hosts:
      - <%= ENV.fetch("PROD_HOST") %>

proxy:
  ssl: <%= ENV.fetch("PROXY_SSL", "true") %>
  host: <%= ENV.fetch("APP_HOST") %>
  app_port: <%= ENV.fetch("APP_PORT", "4000") %>

registry:
  server: <%= ENV.fetch("KAMAL_REGISTRY_SERVER", "registry.gitlab.com") %>
  username:
    - KAMAL_REGISTRY_USERNAME
  password:
    - KAMAL_REGISTRY_PASSWORD

ssh:
  user: <%= ENV.fetch("DEPLOY_SSH_USER", "deploy") %>

builder:
  arch: amd64

env:
  clear:
    PHX_HOST: <%= ENV.fetch("APP_HOST") %>
    PORT: <%= ENV.fetch("APP_PORT", "4000") %>
    PHX_SERVER: "true"
    POOL_SIZE: "10"
  secret:
    - SECRET_KEY_BASE
    - DATABASE_URL
<% if ENV["PROD_BACKUP_BUCKET"].to_s != "" %>
accessories:
  backup:
    image: registry.gitlab.com/eiseron/stack/public-image-bases/gem-runtime:<%= ENV.fetch("BACKUP_IMAGE_TAG", "v0.1.20") %>
    host: <%= ENV.fetch("PROD_HOST") %>
    network: kamal
    cmd: eiseron db backup schedule
    env:
      clear:
        PGHOST: <%= ENV.fetch("PG_CONTAINER", "platform-db") %>
        PGUSER: <%= ENV.fetch("PROD_TENANT_SLUG") %>
        PROD_BACKUP_NAME: <%= ENV.fetch("PROD_TENANT_SLUG") %>
        PROD_BACKUP_DATABASE: <%= ENV.fetch("PROD_TENANT_SLUG") %>_prod
        PROD_BACKUP_BUCKET: <%= ENV.fetch("PROD_BACKUP_BUCKET") %>
        PROD_BACKUP_DIR: /backups
        CLOUDFLARE_ACCOUNT_ID: <%= ENV.fetch("CLOUDFLARE_ACCOUNT_ID") %>
        PROD_BACKUP_AGE_RECIPIENTS: <%= ENV.fetch("PROD_BACKUP_AGE_RECIPIENTS") %>
        BACKUP_CRON: <%= ENV.fetch("BACKUP_CRON", "0 4 * * *") %>
      secret:
        - PGPASSWORD
        - AWS_ACCESS_KEY_ID
        - AWS_SECRET_ACCESS_KEY
    directories:
      - <%= ENV.fetch("PROD_BACKUP_STAGING", "/var/lib/crypt/#{ENV.fetch("PROD_TENANT_SLUG")}/backups") %>:/backups
    options:
      restart: unless-stopped
      health-cmd: "eiseron db backup healthcheck"
      health-interval: 30s
<% end %>
