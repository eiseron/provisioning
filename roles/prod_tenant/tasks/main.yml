- name: Assert tenant inputs are provided
  ansible.builtin.assert:
    that:
      - prod_tenant_name | length > 0
      - prod_tenant_password | length > 0
    fail_msg: "prod_tenant_name and prod_tenant_password are required"

- name: Provision the per-product role and database
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: |
      set -euo pipefail
      docker exec -e PGPASSWORD -e TENANT_PW -i {{ postgres_shared_container_name | quote }} \
        psql -v ON_ERROR_STOP=1 -U {{ pg_shared_user | quote }} -d postgres \
             -v tenant={{ prod_tenant_name | quote }} -v db={{ prod_tenant_db | quote }} <<'SQL'
      \getenv tenant_pw TENANT_PW
      SELECT format('CREATE ROLE %I LOGIN PASSWORD %L', :'tenant', :'tenant_pw')
      WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = :'tenant')\gexec
      SELECT format('ALTER ROLE %I LOGIN PASSWORD %L', :'tenant', :'tenant_pw')\gexec
      SELECT format('CREATE DATABASE %I OWNER %I', :'db', :'tenant')
      WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = :'db')\gexec
      SELECT format('REVOKE ALL ON DATABASE %I FROM PUBLIC', :'db')\gexec
      SQL
  environment:
    PGPASSWORD: "{{ pg_shared_password }}"
    TENANT_PW: "{{ prod_tenant_password }}"
  register: prod_tenant_psql
  changed_when: >-
    'CREATE ROLE' in prod_tenant_psql.stdout
    or 'CREATE DATABASE' in prod_tenant_psql.stdout
  no_log: true
