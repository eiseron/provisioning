- name: Assert the image and host rule are provided
  ansible.builtin.assert:
    that:
      - preview_app_image is defined
      - preview_app_image | length > 0
      - preview_app_host is defined
      - preview_app_host | length > 0
    fail_msg: "preview_app_image and preview_app_host must be supplied"

- name: Check whether the per-MR database already exists
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - -i
      - "{{ postgres_shared_container_name }}"
      - psql
      - -U
      - "{{ preview_app_tenant }}"
      - -d
      - postgres
      - -v
      - "db={{ preview_app_db_name }}"
      - -tA
    stdin: "SELECT 1 FROM pg_database WHERE datname = :'db';"
  register: preview_app_db_check
  changed_when: false

- name: Create the per-MR database owned by the tenant
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - -i
      - "{{ postgres_shared_container_name }}"
      - psql
      - -U
      - "{{ preview_app_tenant }}"
      - -d
      - postgres
      - -v
      - "ON_ERROR_STOP=1"
      - -v
      - "db={{ preview_app_db_name }}"
    stdin: 'CREATE DATABASE :"db";'
  when: preview_app_db_check.stdout | trim != "1"
  changed_when: true

- name: Restrict the per-MR database to its tenant
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - -i
      - "{{ postgres_shared_container_name }}"
      - psql
      - -U
      - "{{ preview_app_tenant }}"
      - -d
      - postgres
      - -v
      - "ON_ERROR_STOP=1"
      - -v
      - "db={{ preview_app_db_name }}"
    stdin: 'REVOKE CONNECT ON DATABASE :"db" FROM PUBLIC;'
  changed_when: false

- name: Ensure the app install directory exists
  ansible.builtin.file:
    path: "{{ preview_app_install_root }}/{{ preview_app_name }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Render the app environment file
  ansible.builtin.template:
    src: app.env.j2
    dest: "{{ preview_app_install_root }}/{{ preview_app_name }}/app.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Render the app compose file
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ preview_app_install_root }}/{{ preview_app_name }}/compose.yml"
    owner: root
    group: root
    mode: "0640"

- name: Bring up the app via docker compose
  community.docker.docker_compose_v2:
    project_src: "{{ preview_app_install_root }}/{{ preview_app_name }}"
    pull: always
    state: present

- name: Run post-deploy commands in the app container
  ansible.builtin.command:
    argv: "{{ ['docker', 'exec', preview_app_name] + item }}"
  loop: "{{ preview_app_post_commands }}"
  changed_when: true
