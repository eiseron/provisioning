- name: Assert the Tang allowlist is provided
  ansible.builtin.assert:
    that:
      - tang_allowed_ips | length > 0
    fail_msg: "tang requires tang_allowed_ips (production host IPs); an empty list would expose tangd to the internet"

- name: Install tang
  ansible.builtin.apt:
    name:
      - tang
      - curl
    state: present
    update_cache: true

- name: Ensure the tangd.socket override directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/tangd.socket.d
    state: directory
    mode: "0755"

- name: Bind tangd to the configured port
  ansible.builtin.copy:
    dest: /etc/systemd/system/tangd.socket.d/override.conf
    content: |
      [Socket]
      ListenStream=
      ListenStream={{ tang_port }}
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd and restart tang

- name: Enable and start the tang socket
  ansible.builtin.systemd:
    name: tangd.socket
    enabled: true
    state: started
    daemon_reload: true

- name: Allow Tang only from the production host IPs
  community.general.ufw:
    rule: allow
    port: "{{ tang_port }}"
    proto: tcp
    from_ip: "{{ item }}"
  loop: "{{ tang_allowed_ips }}"

- name: Read the Tang advertisement thumbprint
  ansible.builtin.command:
    cmd: "tang-show-keys {{ tang_port }}"
  register: tang_advertised_thumbprint
  changed_when: false
  retries: 5
  delay: 3
  until: tang_advertised_thumbprint.stdout | length > 0

- name: Surface the Tang thumbprint to pin in the consumer
  ansible.builtin.debug:
    msg: "Tang advertisement thumbprint (pin as key_server_thumbprint): {{ tang_advertised_thumbprint.stdout }}"
