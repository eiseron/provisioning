- name: Converge
  hosts: all
  become: true
  environment:
    DEBIAN_FRONTEND: noninteractive
  pre_tasks:
    - name: Install apt-utils to avoid dpkg warnings
      ansible.builtin.apt:
        name: apt-utils
        state: present
        update_cache: true
    - name: Create the deploy user (provided by common/preview_server in production)
      ansible.builtin.user:
        name: deploy
        create_home: true
        shell: /bin/bash
  roles:
    - role: docker
    - role: postgres_shared
    - role: preview_tenant
