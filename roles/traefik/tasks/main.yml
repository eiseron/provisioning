- name: Assert ACME email and token when domains are configured
  ansible.builtin.assert:
    that:
      - traefik_acme_email | length > 0
      - traefik_acme_cf_dns_api_token | length > 0
    fail_msg: >-
      traefik_acme_domains is non-empty, so traefik_acme_email and
      traefik_acme_cf_dns_api_token are required for Let's Encrypt wildcard
      certificate issuance.
  when: traefik_acme_domains | length > 0

- name: Ensure traefik install directory exists
  ansible.builtin.file:
    path: "{{ traefik_install_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Ensure traefik log directory exists
  ansible.builtin.file:
    path: "{{ traefik_log_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Create traefik external docker network
  community.docker.docker_network:
    name: "{{ traefik_network_external }}"
    state: present

- name: Create postgres external docker network
  community.docker.docker_network:
    name: "{{ postgres_network_external }}"
    state: present

- name: Ensure ACME storage directory exists
  ansible.builtin.file:
    path: "{{ traefik_install_dir }}/acme"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Render traefik static config
  ansible.builtin.template:
    src: traefik.yml.j2
    dest: "{{ traefik_install_dir }}/traefik.yml"
    owner: root
    group: root
    mode: "0640"
  notify: Restart traefik

- name: Render traefik compose env file (CF DNS API token)
  ansible.builtin.copy:
    dest: "{{ traefik_install_dir }}/traefik.env"
    content: "CF_DNS_API_TOKEN={{ traefik_acme_cf_dns_api_token }}\n"
    owner: root
    group: root
    mode: "0600"
  notify: Restart traefik
  no_log: true

- name: Render traefik compose file
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ traefik_install_dir }}/compose.yml"
    owner: root
    group: root
    mode: "0640"
  notify: Restart traefik

- name: Bring up traefik via docker compose
  community.docker.docker_compose_v2:
    project_src: "{{ traefik_install_dir }}"
    state: present

- name: Apply pending traefik restarts before verifying certificates
  ansible.builtin.meta: flush_handlers

- name: Verify ACME certificates are issued
  when:
    - traefik_acme_wait | bool
    - traefik_acme_domains | length > 0
  block:
    - name: Wait for a valid Let's Encrypt certificate on each ACME domain
      ansible.builtin.shell:
        cmd: >-
          curl -sk -v --max-time 10
          --resolve "acme-probe.{{ item }}:443:127.0.0.1"
          "https://acme-probe.{{ item }}/" 2>&1
          | grep -qi "issuer:.*Let's Encrypt"
      loop: "{{ traefik_acme_domains }}"
      register: traefik_cert_check
      retries: 20
      delay: 15
      until: traefik_cert_check.rc == 0
      changed_when: false
  rescue:
    - name: Capture traefik ACME logs for diagnosis
      ansible.builtin.command: "docker logs --tail 120 {{ traefik_container_name }}"
      register: traefik_acme_logs
      changed_when: false
      failed_when: false
    - name: Show traefik ACME diagnostics
      ansible.builtin.debug:
        msg: "{{ ((traefik_acme_logs.stdout | default('')) ~ (traefik_acme_logs.stderr | default(''))).split('\n') | select('search', '(?i)acme|certificate|cloudflare|error|unable|rate|domain') | list }}"
    - name: Fail after dumping ACME diagnostics
      ansible.builtin.fail:
        msg: "ACME certificate not obtained for one of {{ traefik_acme_domains }}. See the traefik ACME log lines above."
