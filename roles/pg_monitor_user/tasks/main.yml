- name: Assert the monitoring role name is provided
  ansible.builtin.assert:
    that:
      - pg_monitor_role_name is defined
      - pg_monitor_role_name | length > 0
    fail_msg: "pg_monitor_role_name must be supplied"

- name: Assert the monitoring role password is provided
  ansible.builtin.assert:
    that:
      - pg_monitor_password is defined
      - pg_monitor_password | length > 0
    fail_msg: "pg_monitor_password must be supplied"

- name: Assert the shared Postgres admin user is provided
  ansible.builtin.assert:
    that:
      - pg_monitor_admin_user is defined
      - pg_monitor_admin_user | length > 0
    fail_msg: "pg_monitor_admin_user (the instance superuser) must be supplied"

- name: Check whether the monitoring role already exists
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - -i
      - "{{ pg_monitor_container_name }}"
      - psql
      - -U
      - "{{ pg_monitor_admin_user }}"
      - -d
      - postgres
      - -v
      - "rname={{ pg_monitor_role_name }}"
      - -tA
    stdin: "SELECT 1 FROM pg_roles WHERE rolname = :'rname';"
  register: pg_monitor_role_check
  changed_when: false

- name: Create the monitoring login role
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - -i
      - "{{ pg_monitor_container_name }}"
      - psql
      - -U
      - "{{ pg_monitor_admin_user }}"
      - -d
      - postgres
      - -v
      - "ON_ERROR_STOP=1"
      - -v
      - "rname={{ pg_monitor_role_name }}"
    stdin: |
      \set rpw '{{ pg_monitor_password }}'
      CREATE ROLE :"rname" LOGIN PASSWORD :'rpw';
  when: pg_monitor_role_check.stdout | trim != "1"
  changed_when: true
  no_log: true

- name: Enforce least-privilege attributes and password on the monitoring role
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - -i
      - "{{ pg_monitor_container_name }}"
      - psql
      - -U
      - "{{ pg_monitor_admin_user }}"
      - -d
      - postgres
      - -v
      - "ON_ERROR_STOP=1"
      - -v
      - "rname={{ pg_monitor_role_name }}"
      - -v
      - "climit={{ pg_monitor_connection_limit | int }}"
    stdin: |
      \set rpw '{{ pg_monitor_password }}'
      ALTER ROLE :"rname" WITH LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE CONNECTION LIMIT :climit PASSWORD :'rpw';
  changed_when: false
  no_log: true

- name: Grant the built-in pg_monitor role to the monitoring role
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - -i
      - "{{ pg_monitor_container_name }}"
      - psql
      - -U
      - "{{ pg_monitor_admin_user }}"
      - -d
      - postgres
      - -v
      - "ON_ERROR_STOP=1"
      - -v
      - "rname={{ pg_monitor_role_name }}"
    stdin: 'GRANT pg_monitor TO :"rname";'
  changed_when: false
