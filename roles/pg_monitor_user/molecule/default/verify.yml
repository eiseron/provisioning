- name: Verify pg_monitor_user role
  hosts: all
  become: true
  gather_facts: false

  tasks:
    - name: Read the monitoring role attributes
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - -i
          - shared-pg
          - psql
          - -U
          - molecule_admin
          - -d
          - postgres
          - -tAc
          - >-
            SELECT rolcanlogin, rolsuper, rolcreatedb, rolcreaterole, rolconnlimit
            FROM pg_roles WHERE rolname = 'molecule_monitoring'
      register: monitor_attrs
      changed_when: false

    - name: Assert the monitoring role can log in but has no superuser or DDL powers
      ansible.builtin.assert:
        that:
          - monitor_attrs.stdout | trim == "t|f|f|f|5"
        fail_msg: >-
          molecule_monitoring attributes are '{{ monitor_attrs.stdout | trim }}',
          expected 't|f|f|f|5' (login, not super, not createdb, not createrole, conn limit 5)

    - name: Read the monitoring role membership in pg_monitor
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - -i
          - shared-pg
          - psql
          - -U
          - molecule_admin
          - -d
          - postgres
          - -tAc
          - "SELECT pg_has_role('molecule_monitoring', 'pg_monitor', 'MEMBER')"
      register: monitor_membership
      changed_when: false

    - name: Assert the monitoring role is a member of pg_monitor
      ansible.builtin.assert:
        that:
          - monitor_membership.stdout | trim == "t"
        fail_msg: >-
          molecule_monitoring is not a member of pg_monitor
          (pg_has_role returned '{{ monitor_membership.stdout | trim }}')

    - name: Seed a table with data as the admin
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - -i
          - shared-pg
          - psql
          - -U
          - molecule_admin
          - -d
          - postgres
          - -v
          - "ON_ERROR_STOP=1"
          - -c
          - "CREATE TABLE IF NOT EXISTS secret_data (id int); INSERT INTO secret_data VALUES (42)"
      changed_when: true

    - name: Read monitoring statistics as the monitoring role
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - -i
          - -e
          - PGPASSWORD
          - shared-pg
          - psql
          - -U
          - molecule_monitoring
          - -d
          - postgres
          - -tAc
          - "SELECT count(*) >= 0 FROM pg_stat_database"
      environment:
        PGPASSWORD: "{{ pg_monitor_password }}"
      register: monitor_reads_stats
      changed_when: false

    - name: Assert the monitoring role can read pg_stat_database
      ansible.builtin.assert:
        that:
          - monitor_reads_stats.stdout | trim == "t"
        fail_msg: >-
          molecule_monitoring could not read pg_stat_database
          (got '{{ monitor_reads_stats.stdout | trim }}')

    - name: Attempt to read table data as the monitoring role
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - -i
          - -e
          - PGPASSWORD
          - shared-pg
          - psql
          - -U
          - molecule_monitoring
          - -d
          - postgres
          - -v
          - "ON_ERROR_STOP=1"
          - -tAc
          - "SELECT id FROM secret_data"
      environment:
        PGPASSWORD: "{{ pg_monitor_password }}"
      register: monitor_reads_data
      changed_when: false
      failed_when: false

    - name: Assert the monitoring role is denied access to table data
      ansible.builtin.assert:
        that:
          - monitor_reads_data.rc != 0
          - "'permission denied' in monitor_reads_data.stderr"
        fail_msg: >-
          molecule_monitoring was able to read table data; least-privilege broken.
          rc={{ monitor_reads_data.rc }} stderr='{{ monitor_reads_data.stderr | trim }}'
