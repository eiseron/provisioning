- name: Install prerequisites
  ansible.builtin.apt:
    name: [ca-certificates, curl]
    state: present
    update_cache: true

- name: Add Docker GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/debian/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Add Docker apt repository
  ansible.builtin.apt_repository:
    repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian {{ ansible_distribution_release }} stable"
    filename: docker
    state: present

- name: Install Docker
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Configure Docker daemon (log rotation + storage driver)
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
    content: |
      {
        "log-driver": "json-file",
        "log-opts": {
          "max-size": "{{ docker_daemon_log_max_size }}",
          "max-file": "{{ docker_daemon_log_max_file }}"
        }
      }
  notify: Restart Docker

- name: Enable and start Docker service
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started

- name: Add deploy user to docker group
  ansible.builtin.user:
    name: "{{ deploy_user }}"
    groups: docker
    append: true

- name: Install docker prune systemd service
  ansible.builtin.copy:
    dest: /etc/systemd/system/docker-prune.service
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=Reclaim disk by pruning unused Docker objects
      Requires=docker.service
      After=docker.service

      [Service]
      Type=oneshot
      ExecStart=/usr/bin/docker system prune {{ docker_prune_args }}
  notify: Reload systemd for docker-prune

- name: Install docker prune systemd timer
  ansible.builtin.copy:
    dest: /etc/systemd/system/docker-prune.timer
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=Weekly schedule for docker-prune.service

      [Timer]
      OnCalendar={{ docker_prune_schedule }}
      Persistent=true
      RandomizedDelaySec=15m

      [Install]
      WantedBy=timers.target
  notify: Reload systemd for docker-prune

- name: Enable docker prune timer
  ansible.builtin.systemd:
    name: docker-prune.timer
    enabled: "{{ docker_prune_enabled }}"
    state: "{{ 'started' if docker_prune_enabled else 'stopped' }}"
    daemon_reload: true
