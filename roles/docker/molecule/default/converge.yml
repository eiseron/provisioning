- name: Converge
  hosts: all
  become: true
  environment:
    DEBIAN_FRONTEND: noninteractive
  pre_tasks:
    - name: Install apt-utils to avoid dpkg warnings
      ansible.builtin.apt:
        name: apt-utils
        state: present
        update_cache: true
    - name: Create deploy user expected by docker role
      ansible.builtin.user:
        name: deploy
        state: present
        shell: /bin/bash
  roles:
    - role: docker
