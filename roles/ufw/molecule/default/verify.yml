- name: Verify ufw role
  hosts: all
  become: true
  gather_facts: false

  tasks:
    - name: Get ufw status
      ansible.builtin.command: ufw status verbose
      changed_when: false
      register: ufw_status

    - name: Assert ufw is active
      ansible.builtin.assert:
        that: "'Status: active' in ufw_status.stdout"
        fail_msg: "UFW is not active"

    - name: Assert default incoming policy is deny
      ansible.builtin.assert:
        that: "'deny (incoming)' in ufw_status.stdout"
        fail_msg: "UFW default incoming policy is not deny"

    - name: Assert SSH is allowed from anywhere (no source restriction)
      ansible.builtin.assert:
        that: >-
          ufw_status.stdout_lines
          | select('search', '22/tcp.*ALLOW IN.*Anywhere')
          | list
          | length > 0
        fail_msg: "UFW rule for SSH (port 22) open from anywhere not found"

    - name: Assert HTTP is restricted (not open from Anywhere)
      ansible.builtin.assert:
        that: >-
          ufw_status.stdout_lines
          | select('match', '80/tcp.*ALLOW IN\s+Anywhere$')
          | list
          | length == 0
        fail_msg: "UFW port 80 is open from Anywhere — should be Cloudflare-only"

    - name: Assert HTTPS is restricted (not open from Anywhere)
      ansible.builtin.assert:
        that: >-
          ufw_status.stdout_lines
          | select('match', '443/tcp.*ALLOW IN\s+Anywhere$')
          | list
          | length == 0
        fail_msg: "UFW port 443 is open from Anywhere — should be Cloudflare-only"

    - name: Assert at least one HTTP rule with Cloudflare source exists
      ansible.builtin.assert:
        that: >-
          ufw_status.stdout_lines
          | select('search', '80/tcp.*ALLOW IN')
          | list
          | length > 0
        fail_msg: "No UFW rules for port 80 found — Cloudflare rules missing"

    - name: Assert at least one HTTPS rule with Cloudflare source exists
      ansible.builtin.assert:
        that: >-
          ufw_status.stdout_lines
          | select('search', '443/tcp.*ALLOW IN')
          | list
          | length > 0
        fail_msg: "No UFW rules for port 443 found — Cloudflare rules missing"
