- name: Prepare
  hosts: all
  become: true
  tasks:
    - name: Create netdata group
      ansible.builtin.group:
        name: netdata
        state: present

    - name: Create netdata user
      ansible.builtin.user:
        name: netdata
        group: netdata
        system: true
        shell: /usr/sbin/nologin
        home: /var/lib/netdata
        create_home: false
        state: present

    - name: Create stub netdata binary (simulates installed netdata)
      ansible.builtin.copy:
        dest: /usr/sbin/netdata
        content: "#!/bin/sh\n"
        owner: root
        group: root
        mode: "0755"

    - name: Create netdata config directory
      ansible.builtin.file:
        path: /etc/netdata/health.d
        state: directory
        owner: netdata
        group: netdata
        mode: "0750"
